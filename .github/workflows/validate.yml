name: Validate documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint openapi.json

