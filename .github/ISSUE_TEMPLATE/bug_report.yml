name: Documentation or example problem
description: Report an error in the public documentation, OpenAPI contract, or examples.
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, mailbox passwords, message bodies, or customer data.
  - type: input
    id: location
    attributes:
      label: Documentation or example location
      placeholder: docs/endpoints.md or examples/php/send-email.php
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect or unclear.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documentation
      description: Explain the behavior or wording you expected.
    validations:
      required: true

